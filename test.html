<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartleggingstest i grunnleggende regneferdigheter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div id="app" class="w-full max-width-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 max-w-lg">
    <!-- Dynamisk innhold lades her -->
  </div>

  <script>
    // Oppgavesett med 10 oppgaver i økende vanskelighetsgrad
    const mathProblems = [
      { id: 1, expr: "7 + 8", targetValue: 15, latex: "7 + 8", category: "Addisjon", explanation: "Addér tallene direkte: 7 + 8 = 15." },
      { id: 2, expr: "23 - 9", targetValue: 14, latex: "23 - 9", category: "Subtraksjon", explanation: "Trekk 9 fra 23: 23 - 9 = 14." },
      { id: 3, expr: "6 * 7", targetValue: 42, latex: "6 \\times 7", category: "Multiplikasjon", explanation: "Bruk multiplikasjonstabellen: 6 × 7 = 42." },
      { id: 4, expr: "56 / 8", targetValue: 7, latex: "56 \\div 8", category: "Divisjon", explanation: "Hvor mange ganger går 8 opp i 56? 56 ÷ 8 = 7." },
      { id: 5, expr: "18 / 3 + 5", targetValue: 11, latex: "18 \\div 3 + 5", category: "Regnerekkefølge", explanation: "Gjør divisjon før addisjon:\n18 ÷ 3 = 6\n6 + 5 = 11." },
      { id: 6, expr: "4 + 3 * 6", targetValue: 22, latex: "4 + 3 \\times 6", category: "Regnerekkefølge", explanation: "Gjør multiplikasjon før addisjon:\n3 × 6 = 18\n4 + 18 = 22." },
      { id: 7, expr: "1/2 + 1/4", targetValue: 0.75, latex: "\\frac{1}{2} + \\frac{1}{4}", category: "Brøkregning", explanation: "Finn fellesnevner (4):\n1/2 = 2/4\n2/4 + 1/4 = 3/4 (eller 0,75)." },
      { id: 8, expr: "3/4 - 1/3", targetValue: 5/12, latex: "\\frac{3}{4} - \\frac{1}{3}", category: "Brøkregning", explanation: "Finn fellesnevner (12):\n3/4 = 9/12\n1/3 = 4/12\n9/12 - 4/12 = 5/12." },
      { id: 9, expr: "(12 - 4) * (2 + 3)", targetValue: 40, latex: "(12 - 4) \\times (2 + 3)", category: "Parenteser og sammensatt", explanation: "Regn ut parentesene først:\n(12 - 4) = 8\n(2 + 3) = 5\n8 × 5 = 40." },
      { id: 10, expr: "30 - 2 * (4 + 3)", targetValue: 16, latex: "30 - 2 \\times (4 + 3)", category: "Parenteser og regnerekkefølge", explanation: "1. Regn ut parentesen først: 4 + 3 = 7\n2. Utfør multiplikasjon: 2 × 7 = 14\n3. Utfør subtraksjon: 30 - 14 = 16." }
    ];

    let currentIndex = 0;
    let userAnswers = [];
    let showExplanations = false;

    const app = document.getElementById("app");

    // Funksjon for å parsere brukere sine svar (støtter heltall, desimaler med . eller , og brøker som 3/4)
    function parseInput(inputStr) {
      if (!inputStr) return NaN;
      let clean = inputStr.trim().replace(',', '.');
      if (clean.includes('/')) {
        const parts = clean.split('/');
        if (parts.length === 2) {
          const num = parseFloat(parts[0]);
          const den = parseFloat(parts[1]);
          if (!isNaN(num) && !isNaN(den) && den !== 0) {
            return num / den;
          }
        }
        return NaN;
      }
      return parseFloat(clean);
    }

    // Start-skjerm
    function renderStart() {
      app.innerHTML = `
        <div class="text-center">
          <h1 class="text-2xl font-bold text-slate-800 mb-4">Kartleggingstest</h1>
          <p class="text-slate-600 mb-6 leading-relaxed">
            Testen består av 10 oppgaver i grunnleggende regneferdigheter med økende vanskelighetsgrad.
          </p>
          <div class="text-left bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 text-sm text-slate-600 space-y-2">
            <p>• Svar med heltall, desimaltall eller brøk (f.eks. <code class="bg-white px-1.5 py-0.5 rounded border border-slate-300">2/3</code>).</p>
            <p>• Du får ingen tilbakemelding underveis.</p>
            <p>• Du kan bruke så lang tid du vil.</p>
          </div>
          <button onclick="startTest()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-md hover:shadow-lg">
            Start testen
          </button>
        </div>
      `;
    }

    function startTest() {
      currentIndex = 0;
      userAnswers = [];
      showExplanations = false;
      renderQuestion();
    }

    // Vis spørsmål
    function renderQuestion() {
      const prob = mathProblems[currentIndex];
      app.innerHTML = `
        <div>
          <div class="flex justify-between items-center mb-8">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Oppgave ${currentIndex + 1} av 10</span>
            <div class="w-24 bg-slate-100 h-2 rounded-full overflow-hidden">
              <div class="bg-blue-600 h-full transition-all duration-300" style="width: ${((currentIndex + 1) / 10) * 100}%"></div>
            </div>
          </div>

          <div class="text-center py-8">
            <div class="text-4xl font-bold text-slate-800 tracking-wide font-mono mb-2">
              ${prob.expr}
            </div>
          </div>

          <form onsubmit="handleAnswer(event)" class="space-y-4">
            <input 
              type="text" 
              id="answerInput"
              placeholder="Skriv svaret ditt her..." 
              autofocus 
              required
              autocomplete="off"
              class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-center text-lg transition duration-150"
            />
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-sm">
              Neste
            </button>
          </form>
        </div>
      `;
      setTimeout(() => {
        const input = document.getElementById("answerInput");
        if (input) input.focus();
      }, 50);
    }

    function handleAnswer(e) {
      e.preventDefault();
      const input = document.getElementById("answerInput").value;
      userAnswers.push(input);

      currentIndex++;
      if (currentIndex < mathProblems.length) {
        renderQuestion();
      } else {
        renderResults();
      }
    }

    // Oppsummering etter 10 oppgaver
    function renderResults() {
      let correctCount = 0;
      const wrongList = [];

      mathProblems.forEach((prob, idx) => {
        const rawUserAns = userAnswers[idx];
        const val = parseInput(rawUserAns);
        const isCorrect = !isNaN(val) && Math.abs(val - prob.targetValue) < 0.0001;

        if (isCorrect) {
          correctCount++;
        } else {
          wrongList.push({
            num: prob.id,
            expr: prob.expr,
            userAns: rawUserAns || "(tomt)",
            correctAns: prob.targetValue,
            explanation: prob.explanation
          });
        }
      });

      let wrongHtml = "";
      if (wrongList.length > 0) {
        wrongHtml = `
          <div class="mt-6 text-left border-t border-slate-200 pt-6">
            <h3 class="text-base font-semibold text-slate-800 mb-4">Feil besvarte oppgaver:</h3>
            <div class="space-y-3">
              ${wrongList.map(item => `
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm">
                  <div class="flex justify-between font-semibold text-slate-700 mb-1">
                    <span>Oppgave ${item.num}: <code class="text-blue-600 font-mono">${item.expr}</code></span>
                  </div>
                  <div class="grid grid-cols-2 gap-2 text-slate-600 mb-2">
                    <div>Ditt svar: <span class="font-medium text-red-600">${item.userAns}</span></div>
                    <div>Riktig svar: <span class="font-medium text-emerald-600">${item.correctAns}</span></div>
                  </div>
                  ${showExplanations ? `
                    <div class="mt-2 pt-2 border-t border-slate-200 text-slate-600 text-xs leading-relaxed whitespace-pre-line bg-white p-2.5 rounded border border-slate-100">
                      <strong>Forklaring:</strong>\n${item.explanation}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
            ${!showExplanations ? `
              <button onclick="toggleExplanations()" class="mt-4 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition duration-150 text-sm">
                Vis trinnvis forklaring for feil oppgaver
              </button>
            ` : ''}
          </div>
        `;
      } else {
        wrongHtml = `
          <div class="mt-6 p-4 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200 text-sm font-medium">
            Fantastisk jobba! Du svarte riktig på alle oppgavene.
          </div>
        `;
      }

      app.innerHTML = `
        <div class="text-center">
          <h2 class="text-2xl font-bold text-slate-800 mb-2">Resultat</h2>
          <p class="text-lg text-slate-600 mb-6">
            Du hadde <span class="font-bold text-blue-600">${correctCount}</span> av <span class="font-bold text-slate-800">10</span> riktige.
          </p>

          ${wrongHtml}

          <div class="mt-8">
            <button onclick="startTest()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-md">
              Ta testen på nytt
            </button>
          </div>
        </div>
      `;
    }

    function toggleExplanations() {
      showExplanations = true;
      renderResults();
    }

    // Start appen
    renderStart();
  </script>
</body>
</html>
```eof

Du kan lagre denne koden som en `.html`-fil (f.eks. `kartleggingstest.html`) og åpne den direkte i en hvilken som helst nettleser!
