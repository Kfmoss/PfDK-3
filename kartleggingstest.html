<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartleggingstest | Matematikk</title>
  <link rel="stylesheet" href="styles/globals_kartleggingstest.css">
  <link rel="stylesheet" href="styles/styleguide_kartleggingstest.css">
  <link rel="stylesheet" href="styles/style_kartleggingstest.css">
  <style>
    :root {
      --page-background: #fffbf2;
      --sidebar-background: #ffe0b2;
      --header-background: #d9d9d9;
      --ink: #241f1b;
      --muted: #6d625b;
      --accent: #a7673f;
      --accent-dark: #824b2d;
      --panel: #fffdf9;
      --line: #eadfd2;
      --success: #2f7657;
      --error: #b94b45;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background: var(--page-background);
      color: var(--ink);
      font-family: "Inter-Regular", Helvetica, sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .kartlegginstest {
      width: 100%;
      min-height: 100vh;
      height: auto;
      display: flex;
      background: var(--page-background);
      overflow: hidden;
    }

    .test-sidebar {
      width: 280px;
      flex: 0 0 280px;
      min-height: 100vh;
      padding: 46px 30px;
      background: var(--sidebar-background);
    }

    .sidebar-brand {
      display: block;
      margin-bottom: 48px;
      color: var(--accent);
      font-family: "Inter-Bold", Helvetica, sans-serif;
      font-size: 27px;
      line-height: 1.1;
    }

    .sidebar-heading {
      margin: 0 0 18px;
      font-family: "Inter-Medium", Helvetica, sans-serif;
      font-size: 16px;
      color: var(--accent-dark);
    }

    .sidebar-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .sidebar-list a {
      display: block;
      padding: 8px 0;
      color: var(--ink);
      font-size: 16px;
    }

    .sidebar-list a[aria-current="page"] {
      color: var(--accent-dark);
      font-family: "Inter-Bold", Helvetica, sans-serif;
    }

    .test-main {
      min-width: 0;
      flex: 1;
      min-height: 100vh;
    }

    .test-header {
      min-height: 87px;
      display: flex;
      align-items: center;
      gap: 34px;
      padding: 16px 42px;
      background: var(--header-background);
      color: var(--accent);
      font-family: "Inter-Medium", Helvetica, sans-serif;
      font-size: 28px;
    }

    .test-header a {
      color: inherit;
    }

    .test-header .header-current {
      color: var(--ink);
      font-family: "Inter-Bold", Helvetica, sans-serif;
    }

    .test-content {
      width: min(760px, calc(100% - 48px));
      margin: 0 auto;
      padding: 58px 0 72px;
    }

    .test-panel {
      padding: clamp(28px, 5vw, 56px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: 0 12px 30px rgba(120, 82, 52, 0.08);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-family: "Inter-Bold", Helvetica, sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    h1, h2 {
      color: var(--ink);
      font-family: "Inter-Bold", Helvetica, sans-serif;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.08;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 30px;
    }

    h3 {
      font-size: 18px;
    }

    .intro, .result-intro {
      max-width: 560px;
      margin-bottom: 26px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .instructions {
      margin: 0 0 28px;
      padding: 18px 20px;
      background: #fff7ea;
      border: 1px solid #f0ddc2;
      color: var(--muted);
      line-height: 1.6;
    }

    .instructions ul {
      margin: 0;
      padding-left: 20px;
    }

    .primary-button, .secondary-button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 3px;
      padding: 12px 20px;
      font-family: "Inter-Bold", Helvetica, sans-serif;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .primary-button {
      background: var(--accent);
      color: #fff;
    }

    .primary-button:hover, .primary-button:focus-visible {
      background: var(--accent-dark);
    }

    .secondary-button {
      margin-top: 24px;
      background: #f3e9dc;
      color: var(--accent-dark);
    }

    .secondary-button:hover, .secondary-button:focus-visible {
      background: #ead9c5;
    }

    button:active {
      transform: translateY(1px);
    }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 44px;
      color: var(--muted);
      font-family: "Inter-Bold", Helvetica, sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .progress-track {
      width: min(220px, 38%);
      height: 8px;
      overflow: hidden;
      background: #eee3d6;
      border-radius: 999px;
    }

    .progress-value {
      height: 100%;
      background: var(--accent);
      transition: width 220ms ease;
    }

    .expression {
      margin: 0 0 42px;
      color: var(--ink);
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 68px);
      line-height: 1;
      text-align: center;
    }

    .answer-label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-family: "Inter-Bold", Helvetica, sans-serif;
      font-size: 14px;
    }

    .answer-input {
      width: 100%;
      min-height: 54px;
      margin-bottom: 14px;
      padding: 12px 16px;
      border: 1px solid #cdbfae;
      border-radius: 3px;
      background: #fff;
      color: var(--ink);
      font-size: 20px;
      text-align: center;
    }

    .answer-input:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(167, 103, 63, 0.2);
    }

    .wrong-list {
      display: grid;
      gap: 12px;
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .wrong-item {
      padding: 16px;
      border: 1px solid var(--line);
      background: #fffaf3;
    }

    .wrong-item p {
      margin-bottom: 7px;
      color: var(--muted);
      line-height: 1.5;
    }

    .wrong-item strong {
      color: var(--ink);
    }

    .answer-wrong { color: var(--error); }
    .answer-correct { color: var(--success); }

    .explanation {
      margin-top: 12px;
      padding: 12px;
      background: #fff;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      white-space: pre-line;
      line-height: 1.55;
    }

    .success-message {
      margin-top: 24px;
      padding: 18px;
      background: #edf7f0;
      border: 1px solid #c7e2d0;
      color: var(--success);
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .kartlegginstest {
        display: block;
      }

      .test-sidebar {
        width: 100%;
        min-height: auto;
        padding: 22px 24px;
      }

      .sidebar-brand {
        margin-bottom: 18px;
      }

      .sidebar-heading, .sidebar-list {
        display: none;
      }

      .test-main {
        min-height: auto;
      }

      .test-header {
        min-height: 64px;
        padding: 14px 24px;
        gap: 20px;
        font-size: 18px;
      }

      .test-content {
        width: min(100% - 28px, 760px);
        padding: 28px 0 44px;
      }

      .test-panel {
        padding: 25px 20px;
      }

      .question-meta {
        margin-bottom: 34px;
      }

      .progress-track {
        width: 34%;
      }
    }
  </style>
</head>
<body>
  <div class="kartlegginstest">
    <aside class="test-sidebar" aria-label="Hovedmeny">
      <a class="sidebar-brand" href="index.html">Matematikk</a>
      <p class="sidebar-heading">Læringsområder</p>
      <nav>
        <ul class="sidebar-list">
          <li><a href="index.html">Oversikt</a></li>
          <li><a href="kartleggingstest.html" aria-current="page">Kartleggingstest</a></li>
          <li><a href="index.html">Oppgaver</a></li>
          <li><a href="index.html">Fremgang</a></li>
        </ul>
      </nav>
    </aside>

    <main class="test-main">
      <header class="test-header">
        <a href="index.html">Hjem</a>
        <span class="header-current">Kartleggingstest</span>
      </header>
      <section class="test-content" aria-live="polite">
        <div id="app" class="test-panel"></div>
      </section>
    </main>
  </div>

  <script>
    const randomInteger = (minimum, maximum) => Math.floor(Math.random() * (maximum - minimum + 1)) + minimum;

    function createRandomTestProblems() {
      const problems = [];
      const addProblem = (expr, targetValue, category, explanation) => {
        problems.push({ id: problems.length + 1, expr, targetValue, category, explanation });
      };

      for (let index = 0; index < 3; index += 1) {
        const type = randomInteger(1, 4);
        if (type === 1) {
          const first = randomInteger(5, 50);
          const second = randomInteger(1, 50);
          addProblem(`${first} + ${second}`, first + second, "Addisjon", `Adder tallene direkte: ${first} + ${second} = ${first + second}.`);
        } else if (type === 2) {
          const first = randomInteger(20, 80);
          const second = randomInteger(1, first - 1);
          addProblem(`${first} - ${second}`, first - second, "Subtraksjon", `Trekk ${second} fra ${first}: ${first} - ${second} = ${first - second}.`);
        } else if (type === 3) {
          const first = randomInteger(2, 12);
          const second = randomInteger(2, 12);
          addProblem(`${first} * ${second}`, first * second, "Multiplikasjon", `Bruk multiplikasjonstabellen: ${first} x ${second} = ${first * second}.`);
        } else {
          const divisor = randomInteger(2, 12);
          const quotient = randomInteger(2, 12);
          addProblem(`${divisor * quotient} / ${divisor}`, quotient, "Divisjon", `${divisor * quotient} delt på ${divisor} er ${quotient}.`);
        }
      }

      for (let index = 0; index < 3; index += 1) {
        const first = randomInteger(2, 10);
        const second = randomInteger(2, 8);
        const third = randomInteger(1, 12);
        const answer = first + second * third;
        addProblem(`${first} + ${second} * ${third}`, answer, "Regnerekkefolge", `Gjor multiplikasjon for addisjon: ${second} x ${third} = ${second * third}, og ${first} + ${second * third} = ${answer}.`);
      }

      for (let index = 0; index < 2; index += 1) {
        const denominator = randomInteger(2, 8);
        const firstNumerator = randomInteger(1, denominator - 1);
        const secondNumerator = randomInteger(1, denominator - 1);
        const answer = (firstNumerator + secondNumerator) / denominator;
        addProblem(`${firstNumerator}/${denominator} + ${secondNumerator}/${denominator}`, answer, "Brokregning", `Legg sammen tellerne: ${firstNumerator + secondNumerator}/${denominator}.`);
      }

      for (let index = 0; index < 2; index += 1) {
        const first = randomInteger(2, 10);
        const second = randomInteger(1, 8);
        const multiplier = randomInteger(2, 6);
        const answer = (first + second) * multiplier;
        addProblem(`(${first} + ${second}) * ${multiplier}`, answer, "Parenteser", `Regn ut parentesen først: ${first} + ${second} = ${first + second}, og ${first + second} x ${multiplier} = ${answer}.`);
      }

      return problems;
    }

    let currentIndex = 0;
    let userAnswers = [];
    let showExplanations = false;
    let mathProblems = createRandomTestProblems();
    const app = document.getElementById("app");

    function parseInput(input) {
      if (!input) return NaN;
      const clean = input.trim().replace(',', '.');
      if (clean.includes('/')) {
        const parts = clean.split('/');
        if (parts.length === 2) {
          const numerator = parseFloat(parts[0]);
          const denominator = parseFloat(parts[1]);
          if (!Number.isNaN(numerator) && !Number.isNaN(denominator) && denominator !== 0) {
            return numerator / denominator;
          }
        }
        return NaN;
      }
      return parseFloat(clean);
    }

    function renderStart() {
      app.innerHTML = `
        <p class="eyebrow">Kartlegging</p>
        <h1>Grunnleggende regneferdigheter</h1>
        <p class="intro">Testen består av 10 tilfeldig valgte oppgaver med økende vanskelighetsgrad. Svar i ditt eget tempo og se en oppsummering når du er ferdig.</p>
        <div class="instructions">
          <ul>
            <li>Du kan svare med heltall, desimaltall eller brøk, for eksempel <strong>2/3</strong>.</li>
            <li>Du får ingen tilbakemelding før testen er fullført.</li>
            <li>Det er ingen tidsbegrensning.</li>
          </ul>
        </div>
        <button class="primary-button" type="button" onclick="startTest()">Start testen</button>
      `;
    }

    function startTest() {
      mathProblems = createRandomTestProblems();
      currentIndex = 0;
      userAnswers = [];
      showExplanations = false;
      renderQuestion();
    }

    function renderQuestion() {
      const problem = mathProblems[currentIndex];
      const progress = ((currentIndex + 1) / mathProblems.length) * 100;
      app.innerHTML = `
        <div class="question-meta">
          <span>Oppgave ${currentIndex + 1} av ${mathProblems.length}</span>
          <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="10" aria-valuenow="${currentIndex + 1}" aria-label="Testfremdrift">
            <div class="progress-value" style="width: ${progress}%"></div>
          </div>
        </div>
        <p class="eyebrow">${problem.category}</p>
        <p class="expression" aria-label="Regnestykke ${problem.expr}">${problem.expr}</p>
        <form onsubmit="handleAnswer(event)">
          <label class="answer-label" for="answerInput">Skriv svaret ditt</label>
          <input class="answer-input" type="text" id="answerInput" autocomplete="off" inputmode="decimal" required autofocus>
          <button class="primary-button" type="submit">Neste oppgave</button>
        </form>
      `;
      document.getElementById("answerInput").focus();
    }

    function handleAnswer(event) {
      event.preventDefault();
      userAnswers.push(document.getElementById("answerInput").value);
      currentIndex += 1;
      if (currentIndex < mathProblems.length) {
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      let correctCount = 0;
      const wrongAnswers = [];

      mathProblems.forEach((problem, index) => {
        const value = parseInput(userAnswers[index]);
        const isCorrect = !Number.isNaN(value) && Math.abs(value - problem.targetValue) < 0.0001;
        if (isCorrect) {
          correctCount += 1;
        } else {
          wrongAnswers.push({ problem, answer: userAnswers[index] || "(tomt)" });
        }
      });

      const wrongHtml = wrongAnswers.length === 0
        ? '<div class="success-message">Fantastisk jobbet! Du svarte riktig på alle oppgavene.</div>'
        : `
          <div class="wrong-list">
            <h3>Oppgaver å se nærmere på</h3>
            ${wrongAnswers.map(({ problem, answer }) => `
              <article class="wrong-item">
                <p><strong>Oppgave ${problem.id}:</strong> ${problem.expr}</p>
                <p>Ditt svar: <strong class="answer-wrong">${answer}</strong></p>
                <p>Riktig svar: <strong class="answer-correct">${problem.targetValue}</strong></p>
                ${showExplanations ? `<div class="explanation"><strong>Forklaring:</strong><br>${problem.explanation}</div>` : ''}
              </article>
            `).join('')}
            ${!showExplanations ? '<button class="secondary-button" type="button" onclick="toggleExplanations()">Vis trinnvise forklaringer</button>' : ''}
          </div>
        `;

      app.innerHTML = `
        <p class="eyebrow">Ferdig</p>
        <h2>Resultatet ditt</h2>
        <p class="result-intro">Du hadde <strong>${correctCount} av ${mathProblems.length}</strong> riktige.</p>
        ${wrongHtml}
        <button class="primary-button" type="button" onclick="startTest()">Ta testen på nytt</button>
      `;
    }

    function toggleExplanations() {
      showExplanations = true;
      renderResults();
    }

    renderStart();
  </script>
</body>
</html>
